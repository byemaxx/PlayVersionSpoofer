name: Soter Diagnostic Build

on:
  push:
    branches:
      - tmp-soter-diag-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build diagnostic APK
        run: |
          chmod +x ./gradlew
          ./gradlew :soterdiag:assembleDebug

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: SoterDiagnostics
          path: soterdiag/build/outputs/apk/debug/soterdiag-debug.apk
          if-no-files-found: error
